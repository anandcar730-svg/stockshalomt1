<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Manager</title>
<!--
  Stock Manager – single-file HTML version of stock_app.py
  ---------------------------------------------------------
  Open this file in any modern browser (phone or PC). No server, no install.
  Data is saved in this browser on this device (IndexedDB).
  Use "Backup & Data" to download a backup or move the data to another device.
-->
<style>
:root{
  --sb:230px;
  --accent:#3157d5;
  --bg:#f5f7fb;
  --surf:#ffffff;
  --txt:#0f172a;
  --muted:#64748b;
  --border:#e7eaf1;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#ca8a04;
  --shadow:0 5px 22px #1725540a;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--txt);display:flex;min-height:100vh}

/* ─── Sidebar ─── */
.sidebar{width:var(--sb);background:#ffffff;color:#334155;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform .25s}
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sb-logo h1{font-size:16px;font-weight:800;margin:0 0 3px;color:#172033;display:flex;align-items:center;gap:8px}
.sb-logo .live{font-size:11px;color:#16a34a;font-weight:500;display:inline-block}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.sb-nav a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:#64748b;text-decoration:none;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;white-space:nowrap}
.sb-nav a:hover{background:#f1f5f9;color:#172033}
.sb-nav a.cur{background:#eaf0ff;color:#2449bd;font-weight:700}
.sb-sep{height:1px;background:var(--border);margin:9px 4px}

/* ─── Main wrapper ─── */
.wrapper{flex:1;margin-left:var(--sb);display:flex;flex-direction:column;min-width:0}
.topbar{background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px #00000008}
.topbar-title{font-size:16px;font-weight:700;color:var(--txt);flex:1}
.menu-btn{display:none;background:none;border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:18px;cursor:pointer;color:var(--txt);line-height:1}
main{flex:1;padding:26px 28px;width:100%;max-width:1500px}

/* ─── Cards ─── */
.card{background:var(--surf);border-radius:14px;padding:21px 22px;margin-bottom:20px;border:1px solid var(--border);box-shadow:var(--shadow)}
h2{margin:0 0 16px;font-size:15px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px}

/* ─── KPI grid ─── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:20px}
.bcard{background:var(--surf);border-radius:14px;padding:18px 17px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.bcard::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#3157d5}
.bcard b{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.bcard span{font-size:12px;color:var(--muted);display:block;margin-top:2px;line-height:1.5}

/* ─── Tables ─── */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;background:#f8fafc}
tbody tr:hover{background:#fafbff}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
.sbb th:first-child,.sbb td:first-child{position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 0 var(--border);min-width:90px}
.sbb th:last-child,.sbb td:last-child{position:sticky;right:0;z-index:2;background:#fff;box-shadow:-2px 0 0 var(--border)}
.sbb th:first-child,.sbb th:last-child{background:#f8fafc}
@media(max-width:600px){.sbb{font-size:13px}.sbb th,.sbb td{padding:8px 5px}.sbb th:not(:first-child):not(:last-child),.sbb td:not(:first-child):not(:last-child){min-width:64px}}

/* ─── Form elements ─── */
input,select,button,textarea{font-size:15px;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb1a}
button{background:var(--accent);color:#fff;border:0;cursor:pointer;font-weight:600;transition:opacity .15s,transform .08s}
button:hover{opacity:.88}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:default}
button.out{background:var(--red)}
button.in{background:var(--green)}
button.del{background:#94a3b8;padding:5px 10px;font-size:12px}
button.mini{padding:6px 10px;font-size:13px;background:#16a34a}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
a{color:#2563eb}

/* ─── Flash messages ─── */
.flash{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:14px;font-weight:500;background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;display:flex;align-items:flex-start;gap:8px}
.flash::before{content:'ℹ';font-size:16px;flex-shrink:0}
.flash.error{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.flash.error::before{content:'⚠'}

/* ─── Tags ─── */
.low{color:var(--red);font-weight:700}
.zero{color:#9ca3af}
.tag{font-size:11.5px;padding:3px 10px;border-radius:99px;color:#fff;font-weight:600;display:inline-block}
.tag.IN{background:var(--green)}.tag.OUT{background:var(--red)}
.tag.PAID{background:var(--green)}.tag.FREE{background:#eab308;color:#111}.tag.CREDIT{background:var(--red)}
.g{color:var(--green);font-weight:600}.r{color:var(--red);font-weight:600}
small{color:var(--muted);font-size:12px}

/* ─── Steps & misc ─── */
.step{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.step:first-of-type{margin-top:0}
.qtyrow{display:flex;gap:8px;align-items:stretch}
.qtyrow button{flex:0 0 52px;font-size:22px;background:#e2e8f0;color:var(--txt)}
.qtyrow input{flex:1;text-align:center;font-size:20px;font-weight:700;min-width:0}
.hint{font-size:13px;color:var(--muted)}
.errbox{background:#fee2e2;color:#991b1b;padding:12px 14px;border-radius:9px;margin-top:10px;display:none;font-size:14px;border:1px solid #fecaca}
.big{width:100%;padding:14px;font-size:17px;font-weight:600;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:99px;background:#e5e7eb;color:#374151;text-decoration:none;font-size:13px;cursor:pointer}
.chip.on{background:#1f2937;color:#fff}
details summary{cursor:pointer;color:#2563eb;font-size:14px;margin-bottom:8px}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.route .arrow{font-size:24px;color:#6b7280;padding-bottom:6px}
.route label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}
.route select{width:100%}
.route>div{min-width:0}
.paygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.paygrid input{position:absolute;opacity:0;pointer-events:none}
.paygrid label{display:block;border:2px solid #d1d5db;border-radius:10px;padding:14px 4px;text-align:center;cursor:pointer;font-weight:600;font-size:15px;background:#fff;user-select:none}
.paygrid small{display:block;font-weight:400;font-size:11px;margin-top:2px}
#pFREE:checked + label{border-color:#ca8a04;background:#fef9c3;color:#713f12}
#pCREDIT:checked + label{border-color:#dc2626;background:#fee2e2;color:#991b1b}

/* ─── Product picker tiles ─── */
.psearch{width:100%;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ptile{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surf);color:var(--txt);border:2px solid var(--border);border-radius:12px;padding:10px;min-height:70px;cursor:pointer;font-size:14px;line-height:1.2;font-weight:400;transition:border-color .12s,box-shadow .12s}
.ptile:hover{box-shadow:0 2px 8px #0001;opacity:1}
.ptile .pn{font-weight:600;overflow-wrap:anywhere;padding-right:18px}
.ptile .pimg{width:100%;height:64px;object-fit:cover;border-radius:8px;background:#f1f5f9}
.pthumb{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#f1f5f9;display:block}
.pnone{width:48px;height:48px;border-radius:8px;background:#f1f5f9;color:#9ca3af;display:flex;align-items:center;justify-content:center;font-size:20px}
.photobtn{display:inline-block;cursor:pointer;background:#e2e8f0;color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
.ptile .ps{font-size:12px;color:var(--green)}
.ptile.zero .ps{color:var(--red)}
.ptile.none{opacity:.45}
.ptile.none .ps{color:var(--red)}
.ptile.sel{border-color:var(--accent);background:#eff6ff}
.ptile .pq{position:absolute;top:6px;right:6px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 6px}
.ptile.sel .pq{display:flex}
.cart{margin-top:14px}
.cartempty{padding:16px;text-align:center;color:var(--muted);font-size:13px;border:2px dashed var(--border);border-radius:10px}
.line{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;background:#f8fafc}
.line .qtyrow .rm{flex:0 0 44px;background:#fee2e2;color:#991b1b;font-size:16px}

/* ─── Stock dashboard ─── */
.shop-dashboard-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.shop-dashboard-head h1{font-size:25px;line-height:1.2;margin:0;color:#172033}
.shop-dashboard-head p{margin:6px 0 0;color:#64748b;font-size:13px}
.shop-quick-actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.shop-quick-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:800;background:#3157d5;color:#fff}
.shop-quick-actions a.secondary{background:#e8edf7;color:#24324b}
.shop-branch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px;margin-bottom:18px}
.shop-branch-card{display:block;position:relative;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;text-decoration:none;color:#172033;box-shadow:0 2px 8px #0f172a08;min-width:0;cursor:pointer}
.shop-branch-card:active{transform:scale(.99)}
.shop-branch-name{font-size:13px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.04em}
.shop-branch-number{font-size:34px;line-height:1.1;font-weight:900;margin:9px 0 2px;color:#172033;font-variant-numeric:tabular-nums}
.shop-branch-caption{font-size:12px;color:#64748b}
.shop-branch-totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid #edf0f5}
.shop-branch-totals span{display:block;font-size:11px;color:#64748b}
.shop-branch-totals strong{display:block;font-size:17px;margin-top:2px}
.shop-low-alert{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:7px;background:#fff1f2;color:#be123c;font-size:12px;font-weight:800}
.shop-movement-card{border-radius:14px;padding:18px;border:1px solid #e2e8f0;background:#fff;box-shadow:0 2px 8px #0f172a08;margin-bottom:18px}
.shop-movement-card h2{font-size:18px;margin-bottom:5px}
.shop-movement-hint{font-size:13px;color:#64748b;margin:0 0 10px}
.shop-movement-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.shop-movement-buttons button{min-height:58px;border-radius:12px;font-size:17px;font-weight:900}
.shop-movement-buttons button.in{background:#15803d}
.shop-movement-buttons button.out{background:#b91c1c}
.stockout-extra{margin-top:14px;padding:16px;border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:12px;background:#fff8f7}
.stock-photo-picker{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px dashed #94a3b8;border-radius:9px;background:#fff;color:#334155;font-weight:600;cursor:pointer}
.stock-photo-picker:hover{border-color:var(--accent);background:#f8faff}
@media(max-width:600px){
  .shop-dashboard-head h1{font-size:22px}
  .shop-quick-actions{display:grid;grid-template-columns:1fr 1fr}
  .shop-quick-actions a{min-height:50px;padding:9px 8px;text-align:center}
  .shop-branch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .shop-branch-card{padding:12px;border-radius:12px}
  .shop-branch-number{font-size:28px}
  .shop-branch-totals strong{font-size:15px}
  .shop-movement-card{padding:14px}
  .shop-movement-buttons button{min-height:62px;font-size:16px}
}

/* ─── Sales by branch ─── */
.bc-wrap{overflow-x:auto}
.bc-tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
.bc-bar-bg{background:#e2e8f0;border-radius:99px;height:12px;min-width:60px;overflow:hidden}
.bc-bar-fill{height:12px;border-radius:99px;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.bc-dl{display:inline-flex;align-items:center;gap:5px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.bc-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.bc-badge.credit{background:#fee2e2;color:#991b1b}
.bc-badge.free{background:#fef9c3;color:#713f12}
.bc-rank{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#f1f5f9;color:var(--muted);font-size:11px;font-weight:700;align-items:center;justify-content:center}
.bc-rank.top{background:#fef9c3;color:#713f12}

/* ─── Branch dashboard ─── */
.bdh{border-radius:18px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#111827,#374151 60%,#4f46e5);margin-bottom:14px}
.bdh h2{margin:0;font-size:22px;color:#fff}
.bdh p{margin:2px 0 12px;color:#c7d2fe;font-size:13px}
.bds{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.bds div{background:#ffffff1f;border-radius:12px;padding:9px 12px}
.bds b{display:block;font-size:22px;line-height:1.1}
.bds span{font-size:12px;color:#e0e7ff}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
@media(max-width:400px){.bdgrid{grid-template-columns:1fr}}
.bdc{background:#fff;border-radius:18px;box-shadow:0 2px 10px #0000001a;overflow:hidden;display:flex;flex-direction:column}
.bdc-top{display:flex;gap:12px;align-items:center;padding:14px;color:#fff}
.bdav{flex:0 0 46px;width:46px;height:46px;border-radius:14px;background:#ffffff33;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.bdc-top h3{margin:0;font-size:17px;color:#fff}
.bdc-top small{color:#ffffffcc}
.bdstats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #eef0f3}
.bdstats div{padding:9px 6px;text-align:center}
.bdstats b{display:block;font-size:17px}
.bdstats span{font-size:11px;color:#6b7280}
.bdstats .o b{color:#1d4ed8}.bdstats .i b{color:#15803d}.bdstats .r b{color:#b91c1c}
.bdlist{padding:6px 10px;flex:1}
.bdrow{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #f3f4f6}
.bdrow:last-child{border-bottom:0}
.bdimg{flex:0 0 46px;width:46px;height:46px;border-radius:12px;object-fit:cover;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:20px}
.bdmid{flex:1;min-width:0}
.bdmid .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdmid .mt{font-size:12px;color:#6b7280;margin-top:1px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.out{background:#dbeafe;color:#1d4ed8}.pill.in{background:#dcfce7;color:#166534}.pill.ret{background:#fee2e2;color:#991b1b;margin-left:4px}
.bdq{text-align:right;flex:0 0 auto}
.bdq b{font-size:16px}.bdq span{display:block;font-size:11px;color:#6b7280}
.bdempty{padding:26px 10px;text-align:center;color:#9ca3af;font-size:14px}
.bdfoot{display:block;text-align:center;padding:11px;font-weight:600;font-size:14px;text-decoration:none;background:#f9fafb;color:#4338ca;border-top:1px solid #eef0f3}
.bdfoot:hover{background:#eef2ff}
.bctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bctabs a{padding:7px 14px;border-radius:99px;font-size:14px;text-decoration:none;background:#e5e7eb;color:#374151}
.bctabs a.on{background:#1f2937;color:#fff}
.chat{background:#f3f4f6;border-radius:16px;padding:12px;max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:12px;color:#6b7280;background:#e5e7eb;border-radius:99px;padding:3px 12px;margin:6px 0}
.bub{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px;box-shadow:0 1px 2px #0002;word-wrap:break-word}
.bub.out{align-self:flex-end;background:#dbeafe;border-bottom-right-radius:4px}
.bub.in{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.bub .who{font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px}
.bub .it{display:flex;gap:10px;align-items:center;padding:4px 0}
.bub .it .bdimg{flex-basis:42px;width:42px;height:42px;border-radius:10px}
.bub .it .nm{font-weight:600}
.bub .it .q{font-size:12px;color:#4b5563}
.bub .why{font-size:13px;color:#7f1d1d;margin-top:4px}
.bub .nt{font-size:13px;color:#4b5563;margin-top:2px}
.bub .when{font-size:11px;color:#6b7280;text-align:right;margin-top:4px}
.chatempty{text-align:center;color:#6b7280;padding:30px 0}

/* ─── Login / setup screens ─── */
#authscreen{position:fixed;inset:0;z-index:200;background:#f3f4f6;overflow-y:auto;padding:16px;align-items:center;justify-content:center}
.abox{background:#fff;border-radius:14px;box-shadow:0 2px 12px #0002;padding:24px;width:100%;max-width:380px;margin:auto}
.abox h1{font-size:20px;margin:0 0 6px}
.abox p{color:#4b5563;font-size:14px;margin:0 0 14px}
.abox label{display:block;font-size:13px;color:#374151;margin:12px 0 4px;font-weight:600}
.abox input{width:100%;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:8px}
.abox button{width:100%;margin-top:18px;font-size:17px;font-weight:600;padding:13px;border-radius:8px}
.abox .aerr{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:14px;margin-bottom:10px}
.abox .anote{background:#fef3c7;color:#92400e;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px}
.abox a{color:#2563eb;font-size:14px}
.abox code{font-size:18px;font-weight:800;letter-spacing:.06em;background:#f1f5f9;padding:8px 10px;border-radius:8px;display:block;text-align:center;margin:8px 0;word-break:break-all}
.sb-user{font-size:12px;color:#64748b;margin-top:6px}
.sb-logout a{color:#dc2626 !important}
.page-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;margin:10px 0}
.page-grid label{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px}
.page-grid input{width:auto;padding:0}

/* ─── Responsive ─── */
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:99}
@media(max-width:840px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .overlay.open{display:block}

  </div>
  <main id="main"><p>Loading…</p></main>
</div>

<script>
"use strict";
/* =====================================================================
   Storage: whole app state lives in IndexedDB (falls back to localStorage)
   ===================================================================== */
var DEFAULT_BRANCHES = ["Branch 1", "Branch 2", "Branch 3", "Branch 4"];
var MAX_PHOTO_BYTES = 8 * 1024 * 1024;
var S = null;            // app state
var FLASH = [];          // messages shown on next render

function emptyState(){
  var s = {version: 1, seq: {}, branches: [], products: [], stock: {}, transactions: [],
           sales: [], transfers: [], returns: [], photos: {}, auth: null};
  DEFAULT_BRANCHES.forEach(function(n){ s.branches.push({id: nextIdIn(s, "branches"), name: n}); });
  return s;
}
function nextIdIn(s, table){ s.seq[table] = (s.seq[table] || 0) + 1; return s.seq[table]; }
function nextId(table){ return nextIdIn(S, table); }

var IDB = {
  db: null,
  open: function(){
    return new Promise(function(ok){
      try {
        var rq = indexedDB.open("stock_manager", 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore("kv"); };
        rq.onsuccess = function(){ IDB.db = rq.result; ok(true); };
        rq.onerror = function(){ ok(false); };
      } catch(e){ ok(false); }
    });
  },
  get: function(){
    return new Promise(function(ok){
      if(!IDB.db){ try { ok(JSON.parse(localStorage.getItem("stock_manager") || "null")); } catch(e){ ok(null); } return; }
      var rq = IDB.db.transaction("kv").objectStore("kv").get("state");
      rq.onsuccess = function(){ ok(rq.result || null); };
      rq.onerror = function(){ ok(null); };
    });
  },
  put: function(v){
    return new Promise(function(ok, fail){
      if(!IDB.db){ try { localStorage.setItem("stock_manager", JSON.stringify(v)); ok(); } catch(e){ fail(e); } return; }
      var tx = IDB.db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, "state");
      tx.oncomplete = function(){ ok(); };
      tx.onerror = function(){ fail(tx.error); };
    });
  }
};
var channel = null;
try { channel = new BroadcastChannel("stock_manager"); } catch(e){}

function save(){
  return IDB.put(S).then(function(){
    if(channel) channel.postMessage("changed");
  }).catch(function(e){
    alert("Could not save data on this device: " + (e && e.message ? e.message : e) +
          "\nTry removing some photos, or download a backup.");
  });
}

/* =====================================================================
   Helpers (same rules as the Python app)
   ===================================================================== */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function dateStr(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function now(){ var d = new Date(); return dateStr(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
function fmt(n){ n = parseFloat(n) || 0; return Number.isInteger(n) ? n : Math.round(n * 100) / 100; }
function esc(t){ return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function $(id){ return document.getElementById(id); }
function flash(msg, cat){ FLASH.push({m: msg, cat: cat || ""}); }
function clean(t, max){ t = String(t || "").split(/\s+/).filter(Boolean).join(" "); return max ? t.slice(0, max) : t; }

function branches(){ return S.branches.slice().sort(function(a,b){ return a.id - b.id; }); }
function products(){ return S.products.slice().sort(function(a,b){ return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0; }); }
function branchById(id){ id = +id; return S.branches.find(function(b){ return b.id === id; }); }
function productById(id){ id = +id; return S.products.find(function(p){ return p.id === id; }); }
function bname(id){ var b = branchById(id); return b ? b.name : "?"; }
function getQty(pid, bid){ return S.stock[bid + ":" + pid] || 0; }
function addQty(pid, bid, delta){ var k = bid + ":" + pid; S.stock[k] = Math.round(((S.stock[k] || 0) + delta) * 1e6) / 1e6; }
function addTx(pid, bid, kind, qty, note, stamp, photo){
  S.transactions.push({id: nextId("transactions"), product_id: +pid, branch_id: +bid, kind: kind, qty: qty,
                       note: note || "", created_at: stamp, photo: photo || null});
}
function photoSrc(id){ return id ? (S.photos[id] || "") : ""; }
function storePhoto(dataUrl){ if(!dataUrl) return null; var id = "ph" + nextId("photos"); S.photos[id] = dataUrl; return id; }
function dropUnusedPhoto(id){
  if(!id) return;
  var used = S.products.some(function(p){ return p.photo === id; }) ||
             S.transactions.some(function(t){ return t.photo === id; });
  if(!used) delete S.photos[id];
}

function stockMap(){
  var m = {};
  Object.keys(S.stock).forEach(function(k){
    var p = k.split(":"); (m[p[0]] = m[p[0]] || {})[p[1]] = fmt(S.stock[k]);
  });
  return m;
}
function unitMap(){ var m = {}; S.products.forEach(function(p){ m[p.id] = p.unit; }); return m; }
function branchMap(){ var m = {}; S.branches.forEach(function(b){ m[b.id] = b.name; }); return m; }
function pickerProducts(){ return products().map(function(p){ return {id: p.id, name: p.name, photo: photoSrc(p.photo)}; }); }
function branchOptions(sel){
  return branches().map(function(b){ return '<option value="' + b.id + '"' + (b.id === +sel ? " selected" : "") + ">" + esc(b.name) + "</option>"; }).join("");
}

/* Collect cart lines: same product twice is added together */
function collectLines(items){
  var lines = {}, order = [];
  for(var i = 0; i < items.length; i++){
    var q = parseFloat(items[i].qty);
    if(!(q > 0)) return {error: "Quantities must be more than zero."};
    if(!(items[i].pid in lines)){ lines[items[i].pid] = 0; order.push(items[i].pid); }
    lines[items[i].pid] += q;
  }
  if(!order.length) return {error: "Tap at least one product and enter how many."};
  return {lines: lines, order: order};
}
function itemsText(L){
  return L.order.map(function(pid){ var p = productById(pid); return p.name + " " + fmt(L.lines[pid]) + " " + p.unit; }).join(", ");
}
function shortList(L, bid){
  var short = [];
  L.order.forEach(function(pid){
    var p = productById(pid), have = getQty(pid, bid);
    if(L.lines[pid] > have + 1e-9) short.push(p.name + " (only " + fmt(have) + " " + p.unit + " left)");
  });
  return short;
}

/* CSV download */
function csvCell(v){ v = v == null ? "" : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCSV(filename, header, rows){
  var text = "﻿" + [header].concat(rows).map(function(r){ return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
  downloadBlob(filename, new Blob([text], {type: "text/csv;charset=utf-8"}));
}
function downloadBlob(filename, blob){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* Shrink big phone photos before saving (max 900px JPEG, like the Python app's uploader) */
function readPhoto(file){
  return new Promise(function(ok, fail){
    if(!file) { ok(null); return; }
    if(!file.type || file.type.indexOf("image/") !== 0){ fail("That file is not a photo. Use a JPG, PNG, WEBP or GIF picture."); return; }
    if(file.size > MAX_PHOTO_BYTES){ fail("The photo is too big (maximum 8 MB)."); return; }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var m = 900, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, c.width, c.height);
      cx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); fail("That file is not a photo. Use a JPG, PNG, WEBP or GIF picture."); };
    img.src = url;
  });
}

function niceWhen(stamp, withTime){
  if(withTime === undefined) withTime = true;
  var m = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(stamp || "");
  if(!m) return stamp || "";
  var d = new Date(+m[1], +m[2] - 1, +m[3]), t = new Date(), today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  var diff = Math.round((today - d) / 86400000), day;
  if(diff === 0) day = "Today";
  else if(diff === 1) day = "Yesterday";
  else day = m[3] + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2] - 1] + (+m[1] === t.getFullYear() ? "" : " " + m[1]);
  return withTime ? day + ", " + m[4] + ":" + m[5] : day;
}

/* =====================================================================
   Product picker (same as the Python app's tile picker)
   ===================================================================== */
function ProductPicker(o){
  var tiles = {}, rows = {}, order = [], selected = "", names = {};
  function A(pid){ return o.avail(String(pid)); }
  function U(pid){ return (o.units && o.units[pid]) || ""; }
  function qin(pid){ return rows[pid].querySelector("input[name=qty]"); }
  function changed(){ if(o.onChange) o.onChange(); }
  o.products.forEach(function(p){
    var pid = String(p.id); names[pid] = p.name;
    var b = document.createElement("button");
    b.type = "button"; b.className = "ptile"; b.setAttribute("data-name", p.name.toLowerCase());
    b.innerHTML = (p.photo ? '<img class="pimg" loading="lazy" alt="" src="' + esc(p.photo) + '">' : '') +
      '<span class="pn">' + esc(p.name) + '</span><span class="ps"></span><span class="pq"></span>';
    b.onclick = function(){ tap(pid); };
    o.grid.appendChild(b); tiles[pid] = b;
  });
  function paint(){
    Object.keys(tiles).forEach(function(pid){
      var t = tiles[pid], a = A(pid), on = rows[pid] !== undefined;
      t.querySelector(".ps").textContent = (a > 0 || o.allowZero) ? (a + " " + U(pid)) : "none left";
      t.classList.toggle("sel", on);
      t.classList.toggle("none", !o.allowZero && a <= 0);
      t.classList.toggle("zero", o.allowZero && a <= 0);
      t.querySelector(".pq").textContent = rows[pid] ? (parseFloat(qin(pid).value) || "") : "";
    });
    if(o.empty) o.empty.style.display = order.length === 0 ? "block" : "none";
  }
  function hintRow(pid){
    var r = rows[pid], a = A(pid), h = r.querySelector(".ch"), q = qin(pid);
    h.textContent = o.rowHint ? o.rowHint(pid) : ("In stock: " + a + " " + U(pid));
    h.style.color = a > 0 ? "#166534" : "#dc2626";
    if(a > 0 && !o.allowZero) q.max = a; else q.removeAttribute("max");
  }
  function removeRow(pid){
    if(!rows[pid]) return;
    rows[pid].remove(); delete rows[pid]; order = order.filter(function(x){ return x !== pid; });
    paint(); changed();
  }
  function addRow(pid){
    var r = document.createElement("div"); r.className = "line";
    r.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;align-items:baseline">' +
      '<strong>' + esc(names[pid]) + '</strong><span class="ch hint"></span></div>' +
      '<div class="qtyrow"><button type="button" class="qm" aria-label="Less">&#8722;</button>' +
      '<input name="qty" type="number" step="any" min="0.01" inputmode="decimal">' +
      '<button type="button" class="qp" aria-label="More">+</button>' +
      '<button type="button" class="rm" aria-label="Remove">&#10005;</button></div>';
    rows[pid] = r; order.push(pid); o.cart.appendChild(r);
    var q = qin(pid);
    r.querySelector(".qm").onclick = function(){
      var v = Math.round(((parseFloat(q.value) || 0) - 1) * 100) / 100;
      if(v <= 0) removeRow(pid); else { q.value = v; paint(); changed(); }
    };
    r.querySelector(".qp").onclick = function(){
      var v = Math.round(((parseFloat(q.value) || 0) + 1) * 100) / 100, a = A(pid);
      if(!o.allowZero && a > 0 && v > a) v = a;
      q.value = v; paint(); changed();
    };
    r.querySelector(".rm").onclick = function(){ removeRow(pid); };
    q.addEventListener("input", function(){ paint(); changed(); });
    hintRow(pid);
    return q;
  }
  function tap(pid){
    var a = A(pid);
    if(!o.allowZero && a <= 0){ if(o.notify) o.notify(names[pid] + " has none left here."); return; }
    var capped = false;
    if(!rows[pid]){ addRow(pid).value = 1; }
    else {
      var q = qin(pid), v = Math.round(((parseFloat(q.value) || 0) + 1) * 100) / 100;
      if(!o.allowZero && v > a){ v = a; capped = true; }
      q.value = v;
    }
    paint(); changed();
    if(capped && o.notify) o.notify("Only " + a + " " + U(pid) + " of " + names[pid] + " available.");
  }
  if(o.search){
    o.search.addEventListener("input", function(){
      var k = o.search.value.trim().toLowerCase();
      Object.keys(tiles).forEach(function(pid){
        tiles[pid].style.display = (!k || tiles[pid].getAttribute("data-name").indexOf(k) !== -1) ? "" : "none";
      });
    });
  }
  paint();
  return {
    refresh: function(){ paint(); order.forEach(hintRow); },
    items: function(){ return order.map(function(pid){ return {pid: pid, name: names[pid], qty: parseFloat(qin(pid).value) || 0}; }); }
  };
}

/* =====================================================================
   Router
   ===================================================================== */
var ROUTE = {path: "stock", args: {}};
function parseHash(){
  var h = location.hash.replace(/^#\/?/, ""), qi = h.indexOf("?"), path = qi < 0 ? h : h.slice(0, qi), args = {};
  if(qi >= 0) new URLSearchParams(h.slice(qi + 1)).forEach(function(v, k){ args[k] = v; });
  return {path: path || "stock", args: args};
}
function link(path, args){
  var q = new URLSearchParams();
  Object.keys(args || {}).forEach(function(k){ if(args[k] !== "" && args[k] != null) q.set(k, args[k]); });
  var s = q.toString();
  return "#/" + path + (s ? "?" + s : "");
}
function go(path, args){
  var h = link(path, args);
  if(location.hash === h) render(); else location.hash = h;
}
function render(){
  ROUTE = parseHash();
  if(!authGate()) return;
  var key = ROUTE.path.split("/")[0];
  if(!PAGES[key]){ key = "stock"; ROUTE.path = "stock"; }
  var pk = PAGE_KEY[key];
  if(!canOpenPage(pk)){
    var first = firstAllowedPage();
    if(!first){ logout(); return; }
    flash("You do not have permission to open that page.", "error");
    location.hash = "#/" + first; return;
  }
  if(SALES_PAGES.indexOf(pk) >= 0 && !salesUnlocked()){ showUnlock(); return; }
  if(SALES_PAGES.indexOf(pk) >= 0) SESSION.sales_until = Date.now() + SALES_MINUTES * 60000, saveSession();
  buildNav();
  var page = PAGES[key];
  var body = page.render(ROUTE.args, ROUTE.path);
  var fl = FLASH.map(function(f){ return '<div class="flash ' + f.cat + '">' + esc(f.m) + "</div>"; }).join("");
  FLASH = [];
  $("main").innerHTML = fl + body;
  document.title = page.title + " · Stock Manager";
  document.querySelectorAll("#sidebar a[href^='#/']").forEach(function(a){
    var h = a.getAttribute("href").slice(2);
    a.classList.toggle("cur", ROUTE.path === h || ROUTE.path.indexOf(h + "/") === 0);
  });
  $("sidebar").classList.remove("open"); $("overlay").classList.remove("open");
  if(page.mount) page.mount(ROUTE.args, ROUTE.path);
  if(fl) window.scrollTo(0, 0);
}
function busy(){
  var a = document.activeElement;
  if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
  return !!document.querySelector(".cart .line");
}

/* Shared form helpers */
function errBox(id){
  var el = $(id);
  return {
    show: function(m){ el.textContent = m; el.style.display = "block"; },
    hide: function(){ el.style.display = "none"; }
  };
}
function noProductsMsg(){ return '<p>No products yet. <a href="#/products">Add your products first.</a></p>'; }

/* =====================================================================
   Pages
   ===================================================================== */
var PAGES = {};

/* ---------- Stock ---------- */
PAGES.stock = {
  title: "Stock",
  render: function(args){
    var brs = branches(), prods = products(), today = dateStr(new Date()) + " 00:00:00";
    var sel = +args.branch || (brs[0] && brs[0].id);
    var summary = {};
    brs.forEach(function(b){ summary[b.id] = {units: 0, tin: 0, tout: 0, low: 0}; });
    prods.forEach(function(p){ brs.forEach(function(b){
      var q = getQty(p.id, b.id); summary[b.id].units += q;
      if(p.low_limit > 0 && q <= p.low_limit) summary[b.id].low += 1;
    }); });
    S.transactions.forEach(function(t){
      if(t.created_at >= today && summary[t.branch_id]) summary[t.branch_id][t.kind === "IN" ? "tin" : "tout"] += t.qty;
    });

      '<div style="font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#64748b;margin-bottom:5px">Shop stock desk</div>' +
      '<h1>Stock dashboard</h1><p>Quick stock updates and branch balances.</p></div></div>' +
      '<div class="shop-quick-actions"><a href="#stock-in-out" id="jumpmove">＋ Update stock</a>' +
      (canOpenPage("history") ? '<a class="secondary" href="#/history">View stock history</a>' : '') +
      (canOpenPage("products") ? '<a class="secondary" href="#/products">＋ Products</a>' : '') + '</div>' +
      '<div class="shop-branch-grid">' + brs.map(function(b){
        var s = summary[b.id];
        return '<div class="shop-branch-card" data-branch-id="' + b.id + '" role="button" tabindex="0" aria-label="Open Stock In / Out for ' + esc(b.name) + '">' +
          '<div class="shop-branch-name">' + esc(b.name) + '</div>' +
          '<div class="shop-branch-number">' + fmt(s.units) + '</div><div class="shop-branch-caption">Total units available</div>' +
          '<div class="shop-branch-totals"><div><span>Today IN</span><strong class="g">+' + fmt(s.tin) + '</strong></div>' +
          '<div><span>Today OUT</span><strong class="r">−' + fmt(s.tout) + '</strong></div></div>' +
          (s.low ? '<span class="shop-low-alert">⚠ ' + s.low + ' low-stock item(s)</span>' : '') + '</div>';
      }).join("") + '</div>';

    h += '<div class="shop-movement-card" id="stock-in-out"><h2>Stock In / Out</h2>' +
      '<p class="shop-movement-hint">Select a branch, tap products and enter quantities. Use the large buttons below to save.</p>';
    if(!prods.length) h += noProductsMsg();
    else h += '<div class="step">1 · Branch</div><select id="mb" style="width:100%">' + branchOptions(sel) + '</select>' +
      '<div class="step">2 · Tap the products (tap again to add one more)</div>' +
      '<input class="psearch" id="msearch" type="search" placeholder="Search product…" autocomplete="off">' +
      '<div class="pgrid" id="mgrid"></div><div class="cart"><div class="cartempty" id="mempty">Tap a product above to add it</div><div id="mcart"></div></div>' +
      '<div class="step">Note (optional)</div><input id="mnote" placeholder="Anything to remember" style="width:100%">' +
      '<div id="reasonbox" class="stockout-extra" style="display:none">' +
      '<div class="step" style="margin-top:0;color:#991b1b">Stock OUT remark <span style="color:#dc2626">* Required</span></div>' +
      '<textarea id="mreason" rows="3" maxlength="200" placeholder="Why is this stock going out? e.g. Damaged, expired, missing, given away…" style="width:100%"></textarea>' +
      '<div class="step" style="color:#334155">Photo evidence <span class="hint">· Optional</span></div>' +
      '<label class="stock-photo-picker" for="stockoutphoto">📷 Take a photo or choose an image</label>' +
      '<input type="file" id="stockoutphoto" accept="image/*" capture="environment" style="display:none">' +
      '<div id="stockout-preview-wrap" style="display:none;margin-top:10px"><img id="stockout-preview" alt="Stock OUT photo preview" style="max-width:180px;max-height:180px;border-radius:10px;object-fit:cover;border:1px solid #cbd5e1">' +
      '<button type="button" class="del" id="stockout-clear" style="display:block;margin-top:6px">Remove photo</button></div>' +
      '<small>The photo will be attached to each product entry in this Stock OUT operation.</small></div>' +
      '<div class="errbox" id="merr"></div>' +
      '<div class="shop-movement-buttons"><button type="button" class="in" id="bin" data-kind="IN">＋ Stock IN</button>' +
      '<button type="button" class="out" id="bout" data-kind="OUT">− Stock OUT</button></div>';
    h += '</div>';

    var warns = S.lv ? S.lv.issues.filter(function(i){ return !i.resolved; }).sort(function(a, b){ return b.id - a.id; }).slice(0, 100) : [];
    if(warns.length) h += '<div class="card" style="border-left:5px solid #dc2626;background:#fff7ed"><h2>⚠ Stock / Loyverse warnings (' + warns.length + ')</h2>' +
      warns.map(function(w){ return '<p style="margin:8px 0;padding:8px;background:#ffedd5;border-radius:6px"><strong>' + (w.kind === "unmatched" ? "Product not in app list" : "Sale exceeded available stock") +
        ': ' + esc(w.item_name) + '</strong><br>' + esc(w.detail) + ' <small>· ' + esc(w.created_at) + '</small></p>'; }).join("") +
      '<small>Repeated alerts for the same product are grouped into one active warning. Open Loyverse to match or dismiss unmatched products.</small></div>';
    h += '<div class="card"><h2>Stock by Branch</h2><div class="row" style="margin-bottom:10px"><input id="sbbq" type="search" placeholder="Search product name"></div>' +
      '<div class="scroll"><table class="sbb"><thead><tr><th>Product</th>' + brs.map(function(b){ return '<th class="n">' + esc(b.name) + '</th>'; }).join("") +
      '<th class="n">Total</th></tr></thead><tbody id="sbbbody">' +
      (prods.length ? prods.map(function(p){

function doMove(bid, kind, items, note, photo){

  if(kind === "OUT"){
    var short = shortList(L, bid);
    if(short.length){ flash("Not enough stock in " + b.name + " for: " + short.join(", ") + ". Nothing was saved.", "error"); return go("stock", {branch: bid}); }
  }
  var stamp = now(), ph = storePhoto(photo);
  L.order.forEach(function(pid){
    var q = L.lines[pid];
    addQty(pid, bid, kind === "IN" ? q : -q);
    addTx(pid, bid, kind, q, note, stamp, ph);
  });
  save().then(function(){ flash(b.name + ": stock " + kind + " – " + itemsText(L) + "."); go("stock", {branch: bid}); });
}

function salesQuery(f){
  var rows = S.sales.filter(function(s){
    if(f.branch_id && s.branch_id !== +f.branch_id) return false;
    if((f.pay === "FREE" || f.pay === "CREDIT" || f.pay === "PAID") && s.pay_type !== f.pay) return false;
    if(f.pay === "PENDING" && !(s.pay_type === "CREDIT" && !s.settled_at)) return false;
    if(f.from && s.created_at < f.from + " 00:00:00") return false;
    if(f.to && s.created_at > f.to + " 23:59:59") return false;
    return productById(s.product_id) && branchById(s.branch_id);
  });
  rows.sort(function(a, b){ return b.id - a.id; });
  return rows;
}
function salesCSV(f){
  var rows = salesQuery(f).reverse();
  downloadCSV("sales.csv", ["time","branch","product","qty","unit","payment","customer","credit_paid_on","note"],
    rows.map(function(r){ var p = productById(r.product_id);
      return [r.created_at, bname(r.branch_id), p.name, r.qty, p.unit, r.pay_type, r.customer, r.settled_at || "", r.note]; }));
}

function addSale(bid, pay, customer, note, items){
  var L = collectLines(items), b = branchById(bid), back = {b: bid, p: pay};
  if(L.error){ flash(L.error, "error"); return go("sales", back); }
  var short = shortList(L, bid);
  if(short.length){ flash("Not enough stock in " + b.name + " for: " + short.join(", ") + ". Nothing was saved.", "error"); return go("sales", back); }
  var label = {PAID: "Paid", FREE: "Free", CREDIT: "Credit"}[pay], stamp = now();
  L.order.forEach(function(pid){
    var q = L.lines[pid];
    addQty(pid, bid, -q);
    addTx(pid, bid, "OUT", q, "Sale (" + label + ")" + (customer ? " – " + customer : ""), stamp);
    S.sales.push({id: nextId("sales"), product_id: +pid, branch_id: bid, qty: q, price: 0, total: 0, pay_type: pay,
                  customer: customer, note: note, created_at: stamp, settled_at: null});
  });
  save().then(function(){
    flash("Saved " + label.toLowerCase() + " sale from " + b.name + (customer ? " to " + customer : "") + ": " + itemsText(L) + ".");
    go("sales", back);
  });
}
function settleSale(sid){
  var s = S.sales.find(function(x){ return x.id === sid && x.pay_type === "CREDIT" && !x.settled_at; });
  if(!s){ flash("Nothing to update.", "error"); render(); return; }
  s.settled_at = now();
  save().then(function(){ flash("Credit marked as paid."); render(); });
}
function settleCustomer(name){
  var n = 0, stamp = now();
  S.sales.forEach(function(s){ if((s.customer || "") === name && s.pay_type === "CREDIT" && !s.settled_at){ s.settled_at = stamp; n++; } });
  save().then(function(){ flash("All credit for " + (name || "(no name)") + " marked as paid (" + n + " sale(s))."); render(); });
}

}

}

function moveRoute(args){

  var from = +args.f; if(ids.indexOf(from) < 0) from = ids[0];
  var to = +args.t; if(ids.indexOf(to) < 0 || to === from){ to = ids.find(function(i){ return i !== from; }); if(to === undefined) to = from; }
  return {from: from, to: to};
}

PAGES.transfer = movePage("transfers");
PAGES.returns = movePage("returns");
function pageOf(kind){ return kind === "returns" ? "returns" : "transfer"; }
function addMove(kind, fid, tid, items, reason, note){
  var isRet = kind === "returns", back = {f: fid, t: tid}, L = collectLines(items), bf = branchById(fid), bt = branchById(tid);
  if(fid === tid){ flash("Choose two different branches.", "error"); return go(pageOf(kind), back); }
  if(L.error){ flash(L.error, "error"); return go(pageOf(kind), back); }
  var short = shortList(L, fid);
  if(short.length){ flash("Not enough stock in " + bf.name + " for: " + short.join(", ") + ". Nothing was " + (isRet ? "returned." : "moved."), "error"); return go(pageOf(kind), back); }
  var stamp = now();
  L.order.forEach(function(pid){
    var q = L.lines[pid];
    addQty(pid, fid, -q); addQty(pid, tid, q);
    if(isRet){
      addTx(pid, fid, "OUT", q, "Return to " + bt.name + " — " + reason, stamp);
      addTx(pid, tid, "IN", q, "Return from " + bf.name + " — " + reason, stamp);
      S.returns.push({id: nextId("returns"), product_id: +pid, from_branch_id: fid, to_branch_id: tid, qty: q, reason: reason, note: note, created_at: stamp});
    } else {
      addTx(pid, fid, "OUT", q, "Transfer to " + bt.name, stamp);
      addTx(pid, tid, "IN", q, "Transfer from " + bf.name, stamp);
      S.transfers.push({id: nextId("transfers"), product_id: +pid, from_branch_id: fid, to_branch_id: tid, qty: q, note: note, created_at: stamp});
    }
  });
  save().then(function(){
    flash((isRet ? "Returned from " : "Moved from ") + bf.name + " to " + bt.name + ": " + itemsText(L) + ".");
    go(pageOf(kind), back);
  });
}
function undoMove(kind, id){
  var isRet = kind === "returns", i = S[kind].findIndex(function(r){ return r.id === id; });
  if(i < 0){ flash((isRet ? "Return" : "Transfer") + " not found.", "error"); return render(); }
  var t = S[kind][i], back = {f: t.from_branch_id, t: t.to_branch_id}, have = getQty(t.product_id, t.to_branch_id);
  if(have + 1e-9 < t.qty){
    flash("Can't undo: the " + (isRet ? "branch that received it" : "receiving branch") + " has only " + fmt(have) + " left of these items (it has already used some).", "error");
    return go(pageOf(kind), back);
  }
  var stamp = now(), label = (isRet ? "Return #" : "Transfer #") + id + " undone";
  addQty(t.product_id, t.to_branch_id, -t.qty); addQty(t.product_id, t.from_branch_id, t.qty);
  addTx(t.product_id, t.to_branch_id, "OUT", t.qty, label, stamp);
  addTx(t.product_id, t.from_branch_id, "IN", t.qty, label, stamp);
  S[kind].splice(i, 1);
  save().then(function(){
    flash(isRet ? "Return undone. The items are back in the returning branch." : "Transfer undone. The items are back in the first branch.");
    go(pageOf(kind), back);
  });
}

                 ["#ec4899","#db2777"],["#14b8a6","#0d9488"],["#ef4444","#dc2626"],["#64748b","#475569"]];
function branchMoves(bid, other){
  var groups = {}, list = [];
  [["transfer", "transfers"], ["return", "returns"]].forEach(function(kt){
    S[kt[1]].forEach(function(r){
      if(r.from_branch_id !== bid && r.to_branch_id !== bid) return;
      var p = productById(r.product_id); if(!p) return;
      var out = r.from_branch_id === bid, peer = out ? r.to_branch_id : r.from_branch_id;
      if(other && peer !== other) return;
      var key = kt[0] + "|" + r.from_branch_id + "|" + r.to_branch_id + "|" + r.created_at;
      var g = groups[key];
      if(!g){ g = groups[key] = {is_return: kt[0] === "return", out: out, other: bname(peer), lines: [], reason: r.reason || "", note: r.note || "", stamp: r.created_at || ""}; list.push(g); }
      g.lines.push({name: p.name, unit: p.unit, qty: r.qty, photo: photoSrc(p.photo)});
    });
  });
  return list.sort(function(a, b){ return a.stamp < b.stamp ? -1 : a.stamp > b.stamp ? 1 : 0; });
}
function branchSummary(events){
  var d = new Date(); d.setDate(d.getDate() - 30);
  var cut = dateStr(d), s = {sent: 0, recv: 0, returns: 0, moves: 0};
  events.forEach(function(e){
    if(e.stamp.slice(0, 10) < cut) return;
    var q = e.lines.reduce(function(a, l){ return a + l.qty; }, 0);
    s.moves++; if(e.out) s.sent += q; else s.recv += q; if(e.is_return) s.returns++;
  });
  return s;
}

function historyQuery(f){
  var rows = S.transactions.filter(function(t){
    if(f.branch_id && t.branch_id !== +f.branch_id) return false;
    if(f.product_id && t.product_id !== +f.product_id) return false;
    if(f.from && t.created_at < f.from + " 00:00:00") return false;
    if(f.to && t.created_at > f.to + " 23:59:59") return false;
    return productById(t.product_id) && branchById(t.branch_id);
  });
  rows.sort(function(a, b){ return b.id - a.id; });
  return rows;
}

function nameTaken(name){ var k = name.toLowerCase(); return S.products.some(function(p){ return p.name.toLowerCase() === k; }); }
function createProduct(name, unit, low, qty, bid){
  var p = {id: nextId("products"), name: name, unit: unit, low_limit: low, photo: null};
  S.products.push(p);
  if(qty > 0 && branchById(bid)){ addQty(p.id, +bid, qty); addTx(p.id, +bid, "IN", qty, "Opening stock", now()); }
  return p;
}
function addProduct(name, unit, low, qty, bid, photo){
  name = String(name || "").trim(); unit = String(unit || "").trim() || "pcs";
  low = parseFloat(low || 0); qty = parseFloat(qty || 0);
  if(isNaN(low) || isNaN(qty)){ flash("Numbers only for quantity fields.", "error"); return render(); }
  if(!name || low < 0 || qty < 0){ flash("Please fill the form correctly.", "error"); return render(); }
  if(nameTaken(name)){ flash("'" + name + "' already exists.", "error"); return render(); }
  var p = createProduct(name, unit, low, qty, bid);
  if(photo) p.photo = storePhoto(photo);
  save().then(function(){ flash("Added " + name + "." + (photo ? " Photo saved." : "")); render(); });
}
function bulkAdd(text, bid){
  var added = 0, skipped = [];
  String(text || "").split(/\r?\n/).forEach(function(line){
    var parts = line.split(",").map(function(x){ return x.trim(); });
    if(!parts[0]){ if(line.trim()) skipped.push(line.trim()); return; }
    var qty = parts[1] ? Number(parts[1]) : 0, unit = parts[2] || "pcs", low = parts[3] ? Number(parts[3]) : 0;
    if(isNaN(qty) || isNaN(low) || qty < 0 || low < 0 || nameTaken(parts[0])){ skipped.push(line.trim()); return; }
    createProduct(parts[0], unit, low, qty, bid); added++;
  });
  save().then(function(){ flash("Added " + added + " product(s)." + (skipped.length ? " Skipped: " + skipped.join("; ") : ""), skipped.length ? "error" : ""); render(); });
}
function deleteProduct(pid){
  var p = productById(pid);
  S.products = S.products.filter(function(x){ return x.id !== pid; });
  Object.keys(S.stock).forEach(function(k){ if(+k.split(":")[1] === pid) delete S.stock[k]; });
  var photos = S.transactions.filter(function(t){ return t.product_id === pid && t.photo; }).map(function(t){ return t.photo; });
  ["transactions", "sales", "transfers", "returns"].forEach(function(tb){ S[tb] = S[tb].filter(function(r){ return r.product_id !== pid; }); });
  if(p) photos.push(p.photo);
  if(S.lv){
    Object.keys(S.lv.alias).forEach(function(k){ if(S.lv.alias[k] === pid) delete S.lv.alias[k]; });
    Object.keys(S.lv.groups).forEach(function(k){ var g = S.lv.groups[k]; g.items = g.items.filter(function(c){ return c.product_id !== pid; }); if(!g.items.length) delete S.lv.groups[k]; });
    Object.keys(S.lv.lines).forEach(function(k){ S.lv.lines[k] = S.lv.lines[k].filter(function(l){ return l.product_id !== pid; }); });
  }
  photos.forEach(dropUnusedPhoto);
  save().then(function(){ flash("Product deleted."); render(); });
}

  chars = chars || "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(r); else for(var i = 0; i < n; i++) r[i] = Math.floor(Math.random() * 4294967296);

function authGate(){

  if(!SESSION.auth || SESSION.v !== S.auth.ver){ SESSION = {}; showLogin(); return false; }
  if(SESSION.user_id){
    var u = currentUser();

function showSetup(){
  authForm({
    heading: "Set up passwords", sub: "Choose two passwords before anyone else uses the app.",
    note: "Do this now. Whoever opens this page first sets the passwords.",
    fields: [{id: "app_pw", label: "App password (for everyone who uses the app)", ac: "new-password"},
             {id: "app_pw2", label: "Type the app password again", ac: "new-password"},
             {id: "sales_pw", label: "Sales password (only for Sales, Credit, Loyverse, Settings)", ac: "new-password"},
             {id: "sales_pw2", label: "Type the sales password again", ac: "new-password"}],
    button: "Save passwords",
    extra: '<p style="margin:14px 0 0;font-size:13px">Moving from the Raspberry Pi app? <a href="#" id="setupimport">Import stock_data.db</a> to keep its data, users and passwords.</p><input type="file" id="setupdb" accept=".db,.sqlite,.sqlite3" style="display:none">',
    after: function(){
      $("setupimport").onclick = function(e){ e.preventDefault(); $("setupdb").click(); };
      $("setupdb").onchange = function(){
        var f = this.files && this.files[0]; if(!f) return;
        importSqlite(f).then(function(n){ flash("Imported from " + f.name + ": " + n); render(); },
                             function(err){ var a = $("aerr"); a.textContent = "Could not import: " + (err.message || err); a.style.display = "block"; });
      };
    },
    onSubmit: function(v, ui){
      if(v.app_pw.length < MIN_PASSWORD || v.sales_pw.length < MIN_PASSWORD) return ui.error("Each password needs at least " + MIN_PASSWORD + " characters.");
      if(v.app_pw !== v.app_pw2 || v.sales_pw !== v.sales_pw2) return ui.error("A password and its confirmation don't match.");
      if(v.app_pw === v.sales_pw) return ui.error("The sales password must be different from the app password.");
      var code = newRecoveryCode();
      Promise.all([makeHash(v.app_pw), makeHash(v.sales_pw), makeHash(code)]).then(function(h){
        S.auth = {pw_app: h[0], pw_sales: h[1], recovery: h[2], ver: Date.now(), users: [], log: []};
        startSession({username: "administrator", sales_until: Date.now() + SALES_MINUTES * 60000});
        logEvent("administrator", "LOGIN");
        return save();
      }).then(function(){ showRecoveryCode(code, function(){ flash("Passwords saved. You are signed in."); render(); }); });
    }
  });
}
function newRecoveryCode(){ var c = randomText(16, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"); return c.slice(0, 4) + "-" + c.slice(4, 8) + "-" + c.slice(8, 12) + "-" + c.slice(12); }
function showRecoveryCode(code, done){
  $("sidebar").style.display = "none"; document.querySelector(".wrapper").style.display = "none";
  var el = $("authscreen"); el.style.display = "flex";
  el.innerHTML = '<div class="abox"><h1>🔑 Your recovery code</h1><p>If you ever forget the passwords, this code lets you choose new ones. Nobody can show it to you again.</p>' +
    '<code>' + esc(code) + '</code><div class="anote">Write it down or take a photo and keep it somewhere safe, away from this device.</div>' +
    '<button type="button" id="rcdone">I have saved it</button></div>';
  $("rcdone").onclick = done;
}
function showLogin(error){
  var noUsers = !S.auth.users.length;
  authForm({
    heading: "Stock Manager", sub: noUsers ? "Enter the app password to continue." : "Enter your username and password.",
    error: error || "",
    fields: [{id: "username", label: noUsers ? "Username (leave empty if you have no account)" : "Username", type: "text", ac: "username"},
             {id: "password", label: "Password", ac: "current-password"}],
    button: "Sign in",
    extra: '<p style="margin:14px 0 0"><a href="#" id="forgot">Forgot the password?</a></p>',
    after: function(){ $("forgot").onclick = function(e){ e.preventDefault(); showForgot(); }; },
    onSubmit: function(v, ui){
      if(lockedOut("app")) return ui.error("Too many wrong tries. Wait a minute and try again.");
      var name = v.username.trim(), k = name.toLowerCase();
      var user = name ? S.auth.users.find(function(u){ return u.active && u.username.toLowerCase() === k; }) : null;
      (user ? checkHash(user.password_hash, v.password) : Promise.resolve(false)).then(function(ok){
        if(ok){
          startSession({username: user.username, user_id: user.id, role: user.role === "admin" ? "admin" : "staff", pages: userPages(user)});
          logEvent(user.username, "LOGIN"); delete FAILS.app;
          return save().then(render);
        }
        if(!user && !S.auth.users.length) return checkHash(S.auth.pw_app, v.password).then(function(ok2){
          if(!ok2) return fail();
          startSession({username: "administrator"}); logEvent("administrator", "LOGIN"); delete FAILS.app;
          return save().then(render);
        });
        fail();
      });
      function fail(){
        noteFailure("app");
        if(name){ logEvent(name.slice(0, 40), "FAILED"); save(); }
        ui.error("Username or password is incorrect.");
      }
    }
  });
}
function showUnlock(){
  authForm({
    heading: "Sales is locked", sub: "Enter the sales password to open this page.",
    fields: [{id: "spw", label: "Sales password", ac: "current-password"}], button: "Unlock",
    back: function(){ go(firstAllowedPage() || "stock"); },
    onSubmit: function(v, ui){
      if(lockedOut("sales")) return ui.error("Too many wrong tries. Wait a minute and try again.");
      checkHash(S.auth.pw_sales, v.spw).then(function(ok){
        if(!ok){ noteFailure("sales"); return ui.error("That password is not right."); }
        delete FAILS.sales;
        SESSION.sales_until = Date.now() + SALES_MINUTES * 60000; saveSession(); render();
      });
    }
  });
}
function showForgot(){
  var has = !!S.auth.recovery;
  authForm({
    heading: "Forgot the password?",
    sub: has ? "Enter the recovery code you saved when the passwords were set, then choose new passwords."
             : "No recovery code has been made on this device yet.",
    fields: has ? [{id: "code", label: "Recovery code", type: "text"},
                   {id: "app_pw", label: "New app password", ac: "new-password"},
                   {id: "sales_pw", label: "New sales password", ac: "new-password"}] : [],
    button: has ? "Reset passwords" : "Erase this device and start again",
    note: has ? "This also signs you in as administrator, so you can set new passwords for user accounts on the Users page." :
      "Without the code, the only way back in is to erase the data on this device and start again (then restore a backup file or import stock_data.db). Your stock data is lost unless you have a backup.",
    back: function(){ showLogin(); },
    onSubmit: function(v, ui){
      if(!has){
        if(!confirm("Erase ALL data on this device? This cannot be undone.") || !confirm("Last check: really erase everything?")) return ui.error("Nothing was erased.");
        S = emptyState(); SESSION = {}; return save().then(function(){ flash("All data erased."); render(); });
      }
      if(lockedOut("recovery")) return ui.error("Too many wrong tries. Wait a minute and try again.");
      if(v.app_pw.length < MIN_PASSWORD || v.sales_pw.length < MIN_PASSWORD) return ui.error("Each password needs at least " + MIN_PASSWORD + " characters.");
      if(v.app_pw === v.sales_pw) return ui.error("The sales password must be different from the app password.");
      checkHash(S.auth.recovery, v.code.trim().toUpperCase()).then(function(ok){
        if(!ok){ noteFailure("recovery"); return ui.error("That recovery code is not right."); }
        return Promise.all([makeHash(v.app_pw), makeHash(v.sales_pw)]).then(function(h){
          S.auth.pw_app = h[0]; S.auth.pw_sales = h[1]; S.auth.ver = Date.now();
          startSession({username: "administrator", sales_until: Date.now() + SALES_MINUTES * 60000});
          logEvent("administrator", "LOGIN");
          return save().then(function(){ flash("Passwords reset. You are signed in as administrator."); go("users"); });
        });
      });
    }
  });
}

function pageChecks(name, selected){
  return '<div class="page-grid">' + PAGE_LIST.map(function(p){
    return '<label><input type="checkbox" name="' + name + '" value="' + p[0] + '"' + (selected.indexOf(p[0]) >= 0 ? " checked" : "") + '> ' + esc(p[1]) + '</label>';
  }).join("") + '</div>';
}
function checkedValues(root, name){ return Array.prototype.map.call(root.querySelectorAll("input[name='" + name + "']:checked"), function(i){ return i.value; }); }
function pageLabels(u){
  if(u.role === "admin") return "Full control";
  var ps = userPages(u);
  return PAGE_LIST.filter(function(p){ return ps.indexOf(p[0]) >= 0; }).map(function(p){ return p[1]; }).join(", ") || "No pages";
}

  }
};

PAGES["user-log"] = {

function lvIsIgnored(name){ return !!LV().ignore[lvNorm(name)]; }

function lvApplyLine(pl, pid){

    if(idx < 0) return;

      S.stock[ln.branch_id + ":" + ln.product_id] = back;

function lvClassify(r, cfg){

  var customer = r.customer_id ? ((L.customers[r.customer_id] || {}).name || "") : "";
  if(String(r.receipt_type || "SALE").toUpperCase() === "REFUND") return ["PAID", customer];
  if(["free", "no charge", "no-charge", "complimentary"].some(function(w){ return pays.indexOf(w) >= 0; })) return ["FREE", customer];
  if(cfg.credit_words.some(function(w){ return pays.indexOf(w) >= 0; })) return ["CREDIT", customer || "Walk-in (Loyverse)"];
  if(total === 0) return ["FREE", customer];
  return ["PAID", customer];

function lvProcessReceipt(cfg, r, storeMap, startFrom, accountId){
  var L = LV(), raw = String(r.receipt_number || r.id || "").trim();
  if(!raw) return 0;
  var key = accountId === "default" ? raw : accountId + "::" + raw, old = L.receipts[key];
  var cancelled = !!r.cancelled_at, rtype = String(r.receipt_type || "SALE").toUpperCase(), created = r.receipt_date || r.created_at;
  if(old){ if(cancelled && old.state === "applied"){ lvReverseReceipt(key); return 1; } return 0; }
  if(startFrom && created && !isNaN(new Date(created)) && new Date(created) < startFrom) return 0;
  var bid = storeMap[r.store_id], state = "applied", note = "";

    var pc = lvClassify(r, cfg), when = localStr(created);

                pay_type: pc[0], customer: pc[1], item_name: shown};

function lvRefreshStores(cfg){

          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="del" data-dismiss="' + i.id + '">Dismiss</button>' +

      h += '<div class="card"><h2>Recent Loyverse receipts</h2><div class="scroll"><table><tr><th>When</th><th>Receipt</th><th>Type</th><th>Result</th></tr>' +

  mount: function(){
    var L = LV();
    function done(msg, cat){ return save().then(function(){ if(msg) flash(msg, cat); render(); }); }
    var add = $("lvadd");
    if(add) add.onclick = function(){
      var name = $("lvname").value.trim(), token = $("lvtoken").value.trim(), url = ($("lvurl").value.trim() || LV_DEFAULT_URL).replace(/\/+$/, "");
      if(!name || !token){ flash("Enter an account name and access token.", "error"); return render(); }
      if(!/^https:\/\//i.test(url)){ flash("The API address must start with https://", "error"); return render(); }
      if(L.accounts.some(function(a){ return String(a.name || "").toLowerCase() === name.toLowerCase(); })){ flash("Use a unique account name so the stores are easy to identify.", "error"); return render(); }
      L.accounts.push({id: "acct" + randomText(8, "0123456789abcdef"), name: name, token: token, base_url: url === LV_DEFAULT_URL ? undefined : url});
      done("Added " + name + ". Press ‘Test all account connections and load stores’ next.");
    };
    document.querySelectorAll("[data-delacct]").forEach(function(b){ b.onclick = function(){
      if(!confirm("Remove this account connection? Existing sales history will remain.")) return;
      var id = b.getAttribute("data-delacct");
      L.accounts = L.accounts.filter(function(a){ return String(a.id) !== id; });
      L.pos = L.pos.filter(function(p){ return p.account_id !== id; });
      Object.keys(L.store_map).forEach(function(k){ if(id === "default" ? k.indexOf("::") < 0 : k.indexOf(id + "::") === 0) delete L.store_map[k]; });
      done("Account connection removed. Existing sales history and stock records were kept.");
    }; });
    $("lvtest").onclick = function(){
      var cfgs = lvConfigs(), btn = this;
      if(!cfgs.length){ flash("Add at least one Loyverse account first.", "error"); return render(); }
      btn.disabled = true; btn.textContent = "Testing…";
      var results = [];
      cfgs.reduce(function(p, cfg){
        return p.then(function(){
          return lvRefreshStores(cfg).then(function(stores){
            return lvGet(cfg, "/receipts", {limit: 1}).then(function(){
              return lvRefreshPos(cfg, stores).then(function(n){ return n + " POS"; }, function(e){ return "POS list not loaded (" + e.message + ")"; });
            }).then(function(np){ results.push(cfg.name + ": connected, " + stores.length + " store(s), " + np); });
          }).catch(function(e){ results.push(cfg.name + ": ERROR — " + (e.message || e)); });
        });
      }, Promise.resolve()).then(function(){ done(results.join("; "), results.some(function(r){ return r.indexOf("ERROR") >= 0; }) ? "error" : ""); });
    };
    var cfgIn = $("lvcfg");
    if(cfgIn) cfgIn.onchange = function(){
      var f = this.files && this.files[0]; if(!f) return;
      f.text().then(function(t){
        var raw = JSON.parse(t), list = Array.isArray(raw.accounts) ? raw.accounts : raw.token ? [{id: "default", name: raw.name || "Loyverse account", token: raw.token, base_url: raw.base_url, credit_words: raw.credit_words}] : [];
        var added = 0;
        list.forEach(function(a){
          var token = String(a.token || "").trim();
          if(!token || /^PASTE/.test(token) || L.accounts.some(function(x){ return String(x.id) === String(a.id); })) return;
          L.accounts.push({id: String(a.id || ("acct" + randomText(8, "0123456789abcdef"))), name: String(a.name || "Loyverse account"), token: token,
                           base_url: a.base_url || raw.base_url || undefined, credit_words: a.credit_words || raw.credit_words || undefined});
          added++;
        });
        if(raw.interval_seconds) L.interval = Math.max(30, parseInt(raw.interval_seconds, 10) || 60);
        return done("Loaded " + added + " account(s) from " + f.name + ".");
      }).catch(function(e){ flash("Could not read that file: " + (e.message || e), "error"); render(); });
    };
    var ms = $("lvmapsave");
    if(ms) ms.onclick = function(){
      document.querySelectorAll("[data-map]").forEach(function(s){ var k = s.getAttribute("data-map"); if(L.store_map[k]) L.store_map[k].branch_id = s.value === "" ? null : +s.value; });
      done("Store matching saved.");
    };
    var st = $("lvstart");
    if(st) st.onclick = function(){
      var keys = Object.keys(L.store_map);
      if(!keys.length || keys.some(function(k){ return L.store_map[k].branch_id === null; })){ flash("First match every Loyverse store to a branch (or choose “Don't sync”).", "error"); return render(); }
      var txt = $("lvfrom").value, start = txt ? new Date(txt + "T00:00:00") : new Date();
      if(isNaN(start)){ flash("That date is not valid.", "error"); return render(); }
      Object.assign(L.settings, {start_from: isoUtc(start), last_sync: "", enabled: true, last_error: ""});
      st.disabled = true; st.textContent = "Syncing…";
      flash("Syncing is on. New Loyverse sales will update stock here while this page is open.");
      save().then(lvSyncOnce).then(function(r){ flash(r[1], r[0] ? "" : "error"); render(); });
    };
    var sn = $("lvsync");
    if(sn) sn.onclick = function(){ sn.disabled = true; sn.textContent = "Syncing…"; lvSyncOnce().then(function(r){ flash(r[1], r[0] ? "" : "error"); render(); }); };
    var sp = $("lvstop");
    if(sp) sp.onclick = function(){ L.settings.enabled = false; done("Syncing stopped. Nothing else changes until you start it again."); };
    var bk = $("lvbulk");
    if(bk) bk.onclick = function(){
      var ids = checkedValues($("bulkbox"), "bulkiss").map(Number), added = 0, matched = 0;
      if(!ids.length){ flash("Select at least one unknown Loyverse product.", "error"); return render(); }
      ids.forEach(function(iid){
        var it = L.issues.find(function(i){ return i.id === iid && i.kind === "unmatched" && !i.resolved; });
        if(!it) return;
        var name = String(it.item_name || "").trim(); if(!name) return;
        var p = S.products.find(function(x){ return x.name.trim().toLowerCase() === name.toLowerCase(); });
        if(p) matched++; else { p = createProduct(name, "pcs", 0, 0, 0); added++; }
        L.alias[name.toLowerCase()] = p.id;
        lvApplyPending(name, p.id);
      });
      done("Created " + added + " product(s); matched " + matched + " existing product(s). Pending Loyverse lines were processed. Check stock warnings and set opening stock for newly created products.");
    };
    document.querySelectorAll("[data-match]").forEach(function(b){ b.onclick = function(){
      var iid = +b.getAttribute("data-match"), pid = +document.querySelector("[data-matchsel='" + iid + "']").value;
      var it = L.issues.find(function(i){ return i.id === iid && i.kind === "unmatched" && !i.resolved; });
      if(!pid){ flash("Choose a product.", "error"); return render(); }
      if(!it || !productById(pid)){ flash("That item was already handled.", "error"); return render(); }
      L.alias[it.item_name.toLowerCase()] = pid;
      var n = lvApplyPending(it.item_name, pid);
      done("Matched. " + n + " sale line(s) applied to stock. Future sales of this item match automatically.");
    }; });
    document.querySelectorAll("[data-dismiss]").forEach(function(b){ b.onclick = function(){
      var it = L.issues.find(function(i){ return i.id === +b.getAttribute("data-dismiss"); }); if(it) it.resolved = true; done();
    }; });
    document.querySelectorAll("[data-ignore]").forEach(function(b){ b.onclick = function(){
      var n = clean(b.getAttribute("data-ignore"));
      if(!confirm("Ignore " + n + "? Its future Loyverse sales will not change stock here.")) return;
      lvIgnoreName(n); done("Ignoring ‘" + n + "’. Its Loyverse sales will no longer change stock here.");
    }; });
    bindIgnoreList();
  }
};

    return '<div class="card"><h2>Product Groups / Bundle Mapping</h2><p>Use this page when one Loyverse item represents several separate products in this app. Example: Loyverse “Book and Pen” can deduct 1 Book and 1 Pen for every bundle sold. A bundle can contain different quantities of each component.</p>' +

  },

/* ---------- Loyverse Match ---------- */
PAGES["loyverse-match"] = {
  title: "Loyverse Match",
  render: function(args){
    var L = LV(), q = (args.q || "").trim(), ql = q.toLowerCase(), um = {}, order = [];
    L.issues.filter(function(i){ return i.kind === "unmatched" && !i.resolved && String(i.item_name || "").trim(); }).sort(function(a, b){ return b.id - a.id; }).forEach(function(i){
      var k = i.item_name.trim().toLowerCase();
      if(!um[k]){ um[k] = {name: i.item_name.trim(), lines: 0, last: i.created_at || ""}; order.push(k); }
      um[k].lines += Array.isArray(i.payload) ? i.payload.length : i.payload ? 1 : 0;
    });
    var matched = Object.keys(L.alias).filter(function(k){ return productById(L.alias[k]); }).map(function(k){ var p = productById(L.alias[k]); return {lv_name: k, product: p.name, unit: p.unit}; })
      .sort(function(a, b){ return a.lv_name < b.lv_name ? -1 : 1; });
    var groups = lvGroupList();
    if(ql){
      matched = matched.filter(function(m){ return m.lv_name.toLowerCase().indexOf(ql) >= 0 || m.product.toLowerCase().indexOf(ql) >= 0; });
      groups = groups.filter(function(g){ return g.name.toLowerCase().indexOf(ql) >= 0 || g.components.some(function(c){ return c.name.toLowerCase().indexOf(ql) >= 0; }); });
    }
    return '<div class="card"><h2>Needs matching <small style="font-weight:400;color:#6b7280">· ' + order.length + ' Loyverse item(s)</small></h2>' +
      (order.length ? order.map(function(k){ var u = um[k];
        return '<div class="row" style="padding:8px 0;border-bottom:1px solid #e5e7eb;align-items:center"><div style="flex:1 1 200px"><strong>' + esc(u.name) + '</strong><br><small>' + u.lines + ' sale line(s) waiting · last ' + esc(u.last) + '</small></div>' +
          productSelect('data-umsel="' + esc(u.name) + '" style="flex:1 1 180px"') + '<button data-umlink="' + esc(u.name) + '">Match</button><button class="del" data-umignore="' + esc(u.name) + '">Ignore</button></div>'; }).join("")
        : '<p>✓ Every Loyverse item is matched.</p>') + ignoreListHtml() +
      '<small>Matching applies the waiting sales to stock, and future sales of this item match automatically.</small></div>' +
      '<div class="card"><h2>Loyverse item → App product</h2><div class="row" style="margin-bottom:10px"><input id="mq" value="' + esc(q) + '" placeholder="Search Loyverse or app product name"><button id="mqgo">Search</button></div>' +
      '<div class="scroll"><table><tr><th>Loyverse item</th><th>App product</th><th></th></tr>' +
      matched.map(function(m){ return '<tr><td>' + esc(m.lv_name) + '</td><td><strong>' + esc(m.product) + '</strong> <small>' + esc(m.unit) + '</small></td><td><button class="del" data-unlink="' + esc(m.lv_name) + '">Unlink</button></td></tr>'; }).join("") +
      groups.map(function(g){ return '<tr><td>' + esc(g.name) + '</td><td>' + g.components.map(function(c){ return esc(c.name) + ' × ' + fmt(c.qty); }).join("<br>") + ' <small style="color:#6b7280">(group)</small></td><td></td></tr>'; }).join("") +
      (!matched.length && !groups.length ? '<tr><td colspan="3">Nothing matched yet.</td></tr>' : '') + '</table></div>' +
      '<h2 style="margin-top:16px;font-size:16px">Link a Loyverse item name by hand</h2><div class="row"><input id="hlname" placeholder="Loyverse item name, exactly as in Loyverse">' + productSelect('id="hlprod"') + '<button id="hllink">Link</button></div>' +
      '<small>Loyverse items with exactly the same name as an app product match automatically and are not listed here. Groups are edited on the Product Groups page.</small></div>';
  },
  mount: function(){
    var L = LV();
    function link(name, pid){
      name = clean(name);
      if(!name || !productById(pid)){ flash("Enter the Loyverse item name and choose an app product.", "error"); return render(); }
      L.alias[name.toLowerCase()] = +pid;
      var n = lvApplyPending(name, +pid);
      save().then(function(){ flash("Linked ‘" + name + "’. " + (n ? n + " waiting sale line(s) applied to stock. " : "") + "Future sales of this item match automatically."); render(); });
    }
    $("mqgo").onclick = function(){ go("loyverse-match", {q: $("mq").value}); };
    $("hllink").onclick = function(){ link($("hlname").value, $("hlprod").value); };
    document.querySelectorAll("[data-umlink]").forEach(function(b){ b.onclick = function(){
      var n = b.getAttribute("data-umlink"), sel = Array.prototype.find.call(document.querySelectorAll("[data-umsel]"), function(s){ return s.getAttribute("data-umsel") === n; });
      link(n, sel ? sel.value : "");
    }; });
    document.querySelectorAll("[data-umignore]").forEach(function(b){ b.onclick = function(){
      var n = clean(b.getAttribute("data-umignore"));
      if(!confirm("Ignore this item? Its future Loyverse sales will not change stock here.")) return;
      lvIgnoreName(n); save().then(function(){ flash("Ignoring ‘" + n + "’. Its Loyverse sales will no longer change stock here."); render(); });
    }; });
    document.querySelectorAll("[data-unlink]").forEach(function(b){ b.onclick = function(){
      var n = b.getAttribute("data-unlink");
      if(!confirm("Remove this match? Past sales are not changed.")) return;
      delete L.alias[n]; save().then(function(){ flash("Removed the match for ‘" + n + "’. Past sales were not changed; new sales of it will need matching again."); render(); });
    }; });
    bindIgnoreList();
  }
};
