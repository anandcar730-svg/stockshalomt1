      f.text().then(function(t){
        var j = JSON.parse(t), d = j && j.data;
        if(!d || !Array.isArray(d.branches) || !Array.isArray(d.products) || typeof d.stock !== "object") throw new Error("not a Stock Manager backup");
        if(!confirm("Replace ALL data on this device with this backup" + (j.saved_at ? " from " + j.saved_at : "") + "?" +
                    (d.auth ? "\n\nThe users and passwords from the backup will be used, so you will need to sign in again." : ""))) return;
        var keepAuth = S.auth;
        S = normalize(d);
        if(S.auth) S.auth.ver = Date.now(); else S.auth = keepAuth;
        return save().then(function(){ flash("Backup restored."); go("stock"); });
      }).catch(function(e){ flash("Could not restore: " + (e.message || e), "error"); render(); });
    };
    $("dbfile").onchange = function(){
      var f = this.files && this.files[0]; if(!f) return;
      var err = errBox("dberr");
      if(!confirm("Replace ALL data on this device with the data in " + f.name + "?")){ this.value = ""; return; }
      importSqlite(f).then(function(n){ flash("Imported from " + f.name + ": " + n); go("stock"); },
                           function(e){ err.show("Could not import: " + (e.message || e)); });
    };
    $("bkwipe").onclick = function(){
      if(!confirm("Erase ALL data on this device? This cannot be undone.")) return;
      if(!confirm("Last check: really erase everything? Download a backup first if unsure.")) return;
      S = emptyState();
      save().then(function(){ flash("All data erased."); go("stock"); });
    };
  }
};
function normalize(d){
  var s = {version: 1, seq: d.seq || {}, branches: d.branches || [], products: d.products || [], stock: d.stock || {},
           transactions: d.transactions || [], sales: d.sales || [], transfers: d.transfers || [], returns: d.returns || [], photos: d.photos || {},
           auth: d.auth && d.auth.pw_app ? d.auth : null, lv: Object.assign(lvDefault(), d.lv || {})};
  s.lv.settings = Object.assign(lvDefault().settings, s.lv.settings || {});
  if(s.auth){ s.auth.users = s.auth.users || []; s.auth.log = s.auth.log || []; s.auth.ver = s.auth.ver || 1; }
  if(s.auth && s.auth.users.length) s.seq.users = Math.max(s.seq.users || 0, s.auth.users.reduce(function(a, u){ return Math.max(a, u.id); }, 0));
  ["branches", "products", "transactions", "sales", "transfers", "returns"].forEach(function(t){
    var mx = s[t].reduce(function(a, r){ return Math.max(a, r.id || 0); }, 0);
    s.seq[t] = Math.max(s.seq[t] || 0, mx);
  });
  return s;
}
function loadScript(src){
  return new Promise(function(ok, fail){ var sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = function(){ fail(new Error("could not load the SQLite reader (are you online?)")); }; document.head.appendChild(sc); });
}
function importSqlite(file){
  var base = "https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/";
  return (window.initSqlJs ? Promise.resolve() : loadScript(base + "sql-wasm.js"))
    .then(function(){ return Promise.all([window.initSqlJs({locateFile: function(fn){ return base + fn; }}), file.arrayBuffer()]); })
    .then(function(r){
      var db = new r[0].Database(new Uint8Array(r[1]));
      function rows(sql){ try { var res = db.exec(sql); if(!res.length) return []; var c = res[0].columns; return res[0].values.map(function(v){ var o = {}; c.forEach(function(k, i){ o[k] = v[i]; }); return o; }); } catch(e){ return null; } }
      var br = rows("SELECT id, name FROM branches ORDER BY id"), pr = rows("SELECT id, name, unit, low_limit FROM products");
      if(!br || !pr) throw new Error("this is not a stock_data.db file from the Python app");
      var d = {branches: br, products: pr.map(function(p){ return {id: p.id, name: p.name, unit: p.unit || "pcs", low_limit: p.low_limit || 0, photo: null}; }),
               stock: {}, transactions: [], sales: [], transfers: [], returns: [], photos: {}};
      (rows("SELECT product_id, branch_id, qty FROM stock") || []).forEach(function(s){ if(s.qty) d.stock[s.branch_id + ":" + s.product_id] = s.qty; });
      d.transactions = (rows("SELECT id, product_id, branch_id, kind, qty, note, created_at FROM transactions") || []).map(function(t){ t.note = t.note || ""; t.photo = null; return t; });
      d.sales = (rows("SELECT id, product_id, branch_id, qty, price, total, pay_type, customer, note, created_at, settled_at FROM sales") || []).map(function(s){ s.customer = s.customer || ""; s.note = s.note || ""; return s; });
      d.transfers = (rows("SELECT id, product_id, from_branch_id, to_branch_id, qty, note, created_at FROM transfers") || []).map(function(t){ t.note = t.note || ""; return t; });
      d.returns = (rows("SELECT id, product_id, from_branch_id, to_branch_id, qty, reason, note, created_at FROM returns") || []).map(function(t){ t.note = t.note || ""; return t; });
      // Users and passwords (the Pi app stores werkzeug pbkdf2 hashes, which this page can check)
      var set = {};
      (rows("SELECT key, value FROM settings") || []).forEach(function(r){ set[r.key] = r.value; });
      var auth = null, unsupported = 0;
      if(set.pw_app && set.pw_sales){
        auth = {pw_app: set.pw_app, pw_sales: set.pw_sales, recovery: null, ver: Date.now(), users: [], log: []};
        (rows("SELECT id, username, password_hash, role, page_access, active, created_at FROM app_users ORDER BY id") || []).forEach(function(u){
          var pages = null;
          try { pages = JSON.parse(u.page_access); } catch(e){}
          var role = u.role === "admin" ? "admin" : "staff";
          if(role !== "admin") pages = (Array.isArray(pages) ? pages : (LEGACY_PAGE_ACCESS[u.role] || ["stock", "sales"])).filter(function(p){ return PAGE_KEYS.indexOf(p) >= 0; });
          var ok = /^pbkdf2:sha256/.test(u.password_hash || "");
          if(!ok) unsupported++;
          auth.users.push({id: u.id, username: u.username, password_hash: u.password_hash, role: role, pages: role === "admin" ? null : pages,
                           active: !!u.active, created_at: u.created_at || now(), unsupported: !ok || undefined});
        });
        auth.log = (rows("SELECT username, event, device, created_at FROM user_log ORDER BY id DESC LIMIT 500") || []).reverse()
          .map(function(r, i){ return {id: i + 1, username: r.username, event: r.event, device: r.device || "", created_at: r.created_at}; });
        d.seq = {user_log: auth.log.length};
      }
      // Loyverse data (the access tokens are in loyverse_config.json on the Pi, loaded on the Loyverse page)
      var lv = lvDefault(), nlv = 0;
      (rows("SELECT lv_store_id, lv_store_name, branch_id FROM lv_store_map") || []).forEach(function(m){ lv.store_map[m.lv_store_id] = {name: m.lv_store_name || m.lv_store_id, branch_id: m.branch_id == null ? null : m.branch_id}; });
      (rows("SELECT lv_name, product_id FROM lv_alias") || []).forEach(function(a){ lv.alias[String(a.lv_name).trim().toLowerCase()] = a.product_id; });
      (rows("SELECT lv_name, created_at FROM lv_ignore") || []).forEach(function(g){ lv.ignore[g.lv_name] = g.created_at || now(); });
      (rows("SELECT lv_name, product_id, qty FROM lv_group_items") || []).forEach(function(g){
        var k = String(g.lv_name).trim().toLowerCase(); (lv.groups[k] = lv.groups[k] || {name: g.lv_name, items: []}).items.push({product_id: g.product_id, qty: g.qty});
      });
      (rows("SELECT rowid AS rid, receipt_key, receipt_type, store_id, state, note, created_at, applied_at FROM lv_receipts") || []).forEach(function(r){
        lv.receipts[r.receipt_key] = {receipt_type: r.receipt_type, store_id: r.store_id || "", state: r.state, note: r.note || "", created_at: r.created_at, applied_at: r.applied_at, order: r.rid}; nlv++;
      });
      (rows("SELECT receipt_key, product_id, branch_id, delta, sale_id FROM lv_lines") || []).forEach(function(l){ (lv.lines[l.receipt_key] = lv.lines[l.receipt_key] || []).push({product_id: l.product_id, branch_id: l.branch_id, delta: l.delta, sale_id: l.sale_id}); });
      lv.issues = (rows("SELECT id, kind, receipt_key, item_name, detail, payload, created_at, resolved FROM lv_issues") || []).map(function(i){
        var pl = null; try { pl = JSON.parse(i.payload || "null"); } catch(e){}
        if(i.kind === "unmatched") pl = Array.isArray(pl) ? pl : pl ? [pl] : [];
        return {id: i.id, kind: i.kind, receipt_key: i.receipt_key, item_name: i.item_name || "", detail: i.detail || "", payload: pl, created_at: i.created_at, resolved: !!i.resolved};
      });
      (rows("SELECT customer_id, name, place, phone, updated_at FROM lv_customers") || []).forEach(function(c){ lv.customers[c.customer_id] = {name: c.name, place: c.place || "", phone: c.phone || "", updated_at: c.updated_at}; });
      (rows("SELECT account_id, pos_id, name, store_name, activated, synced_at FROM lv_pos") || []).forEach(function(p){ lv.pos.push({account_id: p.account_id, pos_id: p.pos_id, name: p.name, store_name: p.store_name || "", activated: !!p.activated, synced_at: p.synced_at}); });
      lv.settings = {enabled: set.lv_enabled === "1", start_from: set.lv_start_from || "", last_sync: set.lv_last_sync || "", last_ok: set.lv_last_ok || "", last_error: set.lv_last_error || ""};
      lv.accounts = (S.lv && S.lv.accounts) || [];
      d.lv = lv;
      d.seq = Object.assign(d.seq || {}, {lv_issues: lv.issues.reduce(function(m, i){ return Math.max(m, i.id); }, 0), lv_receipts: nlv ? Object.keys(lv.receipts).reduce(function(m, k){ return Math.max(m, lv.receipts[k].order || 0); }, 0) : 0});
      db.close();
      if(!d.branches.length) d.branches = emptyState().branches;
      var keepAuth = S.auth;
      d.auth = auth;
      S = normalize(d);
      if(!S.auth) S.auth = keepAuth;
      return save().then(function(){
        return d.branches.length + " branches, " + d.products.length + " products, " + d.transactions.length + " stock entries, " +
               d.sales.length + " sales, " + d.transfers.length + " transfers, " + d.returns.length + " returns" +
               (auth ? ", " + auth.users.length + " user account(s) with their Raspberry Pi passwords" +
                       (unsupported ? " (" + unsupported + " need a new password from an administrator)" : "") +
                       ". Make a recovery code in Settings." : ".") +
               (nlv || Object.keys(lv.store_map).length ? " Loyverse: " + nlv + " receipts and the store matching were copied; load loyverse_config.json on the Loyverse page to reconnect the accounts." : "");
      });
    });
}

  var ov = $("overlay"), sb = $("sidebar");
  $("menuBtn").addEventListener("click", function(){ sb.classList.toggle("open"); ov.classList.toggle("open"); });
  ov.addEventListener("click", function(){ sb.classList.remove("open"); ov.classList.remove("open"); });

    if(!ok) $("live").textContent = "● saved in browser storage";
    return IDB.get();
  }).then(function(d){
    S = d ? normalize(d) : emptyState();
    if(!d) return save();
  }).then(function(){
    render();
    lvSchedule();
    // Another tab of this file changed the data: reload it (unless you are typing)
    if(channel) channel.onmessage = function(){
      IDB.get().then(function(d){ if(d){ S = normalize(d); if(!busy()) render(); } });
    };
  });
})();
